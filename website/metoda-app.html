<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one reading column, the same tokens as the air page. Numbers in tables, plain words around them. */
:root {
  color-scheme: dark;
  --bg: #0e1220; --panel: #161b2e; --line: #283052; --line-strong: #66719c; --fg: #eef0f6; --fg-2: #a9b0c6; --muted: #858ea8;
  --accent: #f4a259; --focus: #8fb3ff;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { color-scheme: light; --bg: #eef1f6; --panel: #ffffff; --line: #d3d8e4; --line-strong: #7a8299; --fg: #121726; --fg-2: #4a5268; --muted: #5c647d; --accent: #a8520a; --focus: #2f5fd0; }
}
:root[data-theme="light"] { color-scheme: light; --bg: #eef1f6; --panel: #ffffff; --line: #d3d8e4; --line-strong: #7a8299; --fg: #121726; --fg-2: #4a5268; --muted: #5c647d; --accent: #a8520a; --focus: #2f5fd0; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.6; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2 { font-family: var(--font-display); margin: 0; line-height: 1.15; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.top { display: flex; align-items: center; justify-content: space-between; padding-block: 18px; }
.mark { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; min-height: 40px; }
.mark i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.lang { display: flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px; }
.lang button { font: 600 0.85rem var(--font-mono); letter-spacing: 0.06em; color: var(--fg-2); background: none; border: 0; min-width: 44px; min-height: 36px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--panel); color: var(--fg); }
main { padding-block: 8px 48px; display: grid; gap: 36px; }
.back { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; }
h1 { font-size: clamp(2rem, 6vw, 2.8rem); font-weight: 800; }
.lead { margin-top: 12px; font-size: 1.15rem; color: var(--fg); max-width: 40rem; }
section { display: grid; gap: 12px; }
section h2 { font-size: clamp(1.35rem, 3.4vw, 1.7rem); font-weight: 700; padding-top: 22px; border-top: 1px solid var(--line); }
section p, section li { color: var(--fg-2); }
section b { color: var(--fg); font-weight: 600; }
ul { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.live { color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { text-align: left; padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; font: 600 0.78rem var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-2); }
td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
td { color: var(--fg); }
.small { font-size: 0.92rem; color: var(--muted); }
/* phones: the accuracy table's rows become cards, with the column name above each value */
@media (max-width: 640px) {
  .stack { overflow: visible; border: 0; background: none; }
  .stack thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .stack tbody, .stack tr, .stack td { display: block; }
  .stack tr { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 0; margin-bottom: 10px; }
  .stack td, .stack td.n { border-top: 0; padding: 4px 14px; text-align: left; white-space: normal; }
  .stack td.n { display: inline-block; padding-top: 2px; }
  .stack td.n::before { content: attr(data-label) ": "; color: var(--fg-2); font-size: 0.88rem; }
}
footer { border-top: 1px solid var(--line); padding-block: 22px 36px; display: grid; gap: 8px; font-size: 0.95rem; color: var(--fg-2); }
</style>

<script>
const EEA = '<a href="https://www.eea.europa.eu/en/legal-notice" target="_blank" rel="noopener">';
const CCBY = '<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>';
const FMI = '<a href="https://silam.fmi.fi/" target="_blank" rel="noopener">';
const T = {
  ro: {
    pageTitle: "Cum estimăm aerul · Adia",
    back: "← Aerul de lângă tine",
    title: "Cum estimăm aerul",
    lead: "Pagina „Aerul de lângă tine” nu are senzori proprii. Folosește măsurătorile stațiilor oficiale și o prognoză publică, le verifică și le combină. Aici găsești tot ce facem și cât de precis iese.",
    s: [
      ["De unde vin datele", [
        `<p><b>Măsurători:</b> stațiile Rețelei Naționale de Monitorizare a Calității Aerului, administrată de Agenția Națională pentru Protecția Mediului (ANPM). Le descărcăm de la ${EEA}Agenția Europeană de Mediu</a> (licență ${CCBY}). Sunt valori orare provizorii: ajung cu 1–3 ore întârziere, iar rețeaua le mai poate corecta ulterior.</p>`,
        `<p><b>Prognoză:</b> modelul ${FMI}SILAM</a> al Institutului Meteorologic Finlandez (licență ${CCBY}), pentru câte un punct în fiecare oraș, cu două zile înainte.</p>`,
        `<p><b>Zone:</b> București, cu particule fine (PM2.5), și Buzău, unde singura stație oficială măsoară doar PM10.</p>`,
        "{live:fresh}",
      ]],
      ["Ce valori scoatem", [
        "<p>Înainte de orice calcul, scoatem:</p>",
        "<ul><li>valorile zero sau negative (de obicei o eroare de calibrare a aparatului);</li><li>valorile blocate pe aceeași cifră 6 ore sau mai mult (de obicei un aparat care nu mai măsoară);</li><li>vârfurile izolate: o valoare mai mare decât de 3 ori mediana stațiilor din oraș în acea oră, plus 30 µg/m³ (doar când avem cel puțin 3 stații în acea oră).</li></ul>",
        "{live:dropped}",
      ]],
      ["Valoarea de lângă tine", [
        "<p>Facem o medie a stațiilor din orașul tău, în care fiecare stație contează cu atât mai mult cu cât e mai aproape: ponderea scade cu pătratul distanței, deci o stație la 1 km contează de 4 ori mai mult decât una la 2 km. Stațiile mai apropiate de 500 m sunt socotite la 500 m, ca să nu decidă una singură.</p>",
        "<p>Locația ta nu pleacă din telefon: pagina descarcă datele pentru tot orașul și face calculul singură.</p>",
      ]],
      ["Cât de precis e", [
        "<p>Am testat metoda pe o lună (20 octombrie – 19 noiembrie 2026, PM2.5 orar, București). Am ascuns pe rând fiecare dintre cele 23 de stații oficiale și am estimat-o din celelalte, exact cum estimăm un punct fără stație.</p>",
        `<div class="tbl stack"><table><thead><tr><th scope="col">Ce am comparat</th><th scope="col" class="n">Potrivire (R²)</th><th scope="col" class="n">Eroare tipică</th></tr></thead><tbody>
          <tr><td>Estimarea noastră, la toate cele 23 de stații</td><td class="n">0,87</td><td class="n">3,7 µg/m³</td></tr>
          <tr><td>… unde cea mai apropiată altă stație e la cel mult 2,5 km (15 stații)</td><td class="n">0,90</td><td class="n">3,4 µg/m³</td></tr>
          <tr><td>… unde e mai departe de 2,5 km (8 stații)</td><td class="n">0,80</td><td class="n">5,9 µg/m³</td></tr>
          <tr><td>Pentru comparație: un senzor ieftin aflat lângă o stație oficială (valoarea tipică)</td><td class="n">0,68</td><td class="n">8,8 µg/m³</td></tr>
        </tbody></table></div>`,
        "<p class=\"small\">R² arată cât de bine urmează estimarea valorile reale de la o oră la alta (1 = perfect). Eroarea tipică e abaterea medie pătratică (RMSE).</p>",
        "<p>La pragul de smog, estimarea a prins 82% din orele cu smog ale stației ascunse și a dat alarmă falsă în 2,5% din orele fără smog.</p>",
        "<p>Lângă prag, chiar și stațiile oficiale se contrazic: în orele în care una dintre două stații trece de 25 µg/m³, amândouă trec doar în cam 55–60% din cazuri. De aceea scriem „smog probabil”, nu „smog sigur”.</p>",
      ]],
      ["Prognoza pentru la noapte", [
        "<p>Pornim de la valoarea măsurată lângă tine și urmăm forma prognozei SILAM. Diferența dintre măsurătoare și prognoză se stinge treptat, în cam 6 ore.</p>",
        "<p>Corectăm prognoza cu diferența ei tipică față de stații din ultima săptămână (mediana diferențelor, cel mult ±10 µg/m³). Păstrăm și cât de diferită e zona ta față de restul orașului în ultima zi, de exemplu lângă un bulevard aglomerat (între 0,6 și 1,6 ori).</p>",
        "{live:bias}",
        "<p>Într-o lună de test, modelul SILAM nemodificat a avut nivelul aproape corect (în medie 0,97 din valoarea stațiilor), a prins 62% din orele cu smog și a dat alarmă falsă în 3% din orele fără smog. Am folosit primele ore ale fiecărei prognoze; la 12 ore sau mai mult înainte, prognoza e mai nesigură. Corecția noastră nu a fost încă testată pe o perioadă lungă: o verificăm în iarna aceasta.</p>",
      ]],
      ["Pragurile", [
        "<p>Adia folosește trei trepte pentru PM2.5: <b>bun</b> până la 15 µg/m³, <b>moderat</b> între 15 și 25 și <b>smog</b> peste 25. Le aplicăm fiecărei ore.</p>",
        "<p>Ca repere: Organizația Mondială a Sănătății recomandă cel mult 15 µg/m³ ca medie pe 24 de ore, iar limita zilnică a UE din 2030 e 25 µg/m³. Amândouă sunt medii pe zi, nu valori orare.</p>",
        "<p>Pentru Buzău, unde avem doar PM10, folosim 20 și 30 µg/m³: la stațiile din București, PM2.5 e în medie cam 0,78 din PM10, așa că pragurile sunt aproximativ echivalente.</p>",
        "<p>Indicele european de calitate a aerului (6 trepte, de la „Bun” la „Extrem de rău”) apare separat, pentru comparație.</p>",
      ]],
      ["Calculatorul de CO₂ din dormitor", [
        "<p>E un calcul, nu o măsurătoare: 13 litri de CO₂ pe oră pentru fiecare om care doarme, camera înaltă de 2,6 m, 0,4 schimburi de aer pe oră cu geamul închis, aer de afară cu 420 ppm, 600 ppm la culcare și 8 ore de somn. Cu ușa deschisă, adăugăm 50 m³ de aer din restul casei. În camerele renovate, cu geamuri etanșe, aerul se schimbă de obicei mai rar, iar valoarea e mai mare.</p>",
        "<p>Adia măsoară valoarea reală din camera ta.</p>",
      ]],
      ["Ce nu poate face", [
        "<ul><li>Valorile sunt pentru aerul de afară. În cameră, cu geamul închis, intră mai puține particule, dar CO₂ se adună.</li><li>La marginile orașului stațiile sunt rare, iar eroarea e mai mare (vezi tabelul).</li><li>Datele sunt provizorii și pot avea goluri. Dacă ultima măsurătoare e mai veche de 4 ore te avertizăm; după 8 ore nu mai dăm niciun sfat.</li><li>Nu sunt sfaturi medicale. Dacă ai astm sau altă boală respiratorie, urmează sfatul medicului.</li></ul>",
      ]],
      ["Stațiile folosite acum", ["{live:stations}"]],
    ],
    fresh: "Datele se actualizează o dată pe oră. Ultima actualizare: {g} (ora României), cu măsurători până la {m}.",
    dropped: "În ultima săptămână am scos {z} valori zero sau negative, {s} valori blocate și {p} vârfuri izolate.",
    bias: "Corecția de acum: {list}.",
    biasItem: "{city} {v} µg/m³ {p}",
    stHead: ["Stația", "Tip", "Măsoară"],
    type: { traffic: "lângă trafic", background: "fond urban", industrial: "zonă industrială", other: "" },
    city: { bucharest: "București", buzau: "Buzău" },
    noData: "Datele de acum nu s-au putut încărca, așa că lipsesc cifrele actualizate de mai sus.",
  },
  en: {
    pageTitle: "How we estimate the air · Adia",
    back: "← The air near you",
    title: "How we estimate the air",
    lead: "The “air near you” page has no sensors of its own. It uses the official stations' measurements and a public forecast, checks them and combines them. Here is everything we do, and how accurate it is.",
    s: [
      ["Where the data comes from", [
        `<p><b>Measurements:</b> the stations of Romania's National Air Quality Monitoring Network, run by the National Environmental Protection Agency (ANPM). We download them from the ${EEA}European Environment Agency</a> (${CCBY} licence). They are provisional hourly values: they arrive 1–3 hours late, and the network may still correct them.</p>`,
        `<p><b>Forecast:</b> the Finnish Meteorological Institute's ${FMI}SILAM</a> model (${CCBY} licence), for one point in each city, two days ahead.</p>`,
        `<p><b>Areas:</b> Bucharest, with fine particles (PM2.5), and Buzău, where the only official station measures PM10 only.</p>`,
        "{live:fresh}",
      ]],
      ["What we drop", [
        "<p>Before any calculation, we drop:</p>",
        "<ul><li>zero or negative values (usually a calibration error in the instrument);</li><li>values stuck on the same number for 6 hours or more (usually an instrument that stopped measuring);</li><li>isolated peaks: a value above 3 times the median of the city's stations that hour, plus 30 µg/m³ (only when at least 3 stations report that hour).</li></ul>",
        "{live:dropped}",
      ]],
      ["The value near you", [
        "<p>We average the stations in your city, with each station counting more the closer it is: the weight falls with the square of the distance, so a station 1 km away counts 4 times as much as one 2 km away. Stations closer than 500 m are counted as 500 m away, so that no single one decides.</p>",
        "<p>Your location never leaves your phone: the page downloads the data for the whole city and does the calculation itself.</p>",
      ]],
      ["How accurate it is", [
        "<p>We tested the method over a month (20 October – 19 November 2026, hourly PM2.5, Bucharest). We hid each of the 23 official stations in turn and estimated it from the others, exactly as we estimate a spot with no station.</p>",
        `<div class="tbl stack"><table><thead><tr><th scope="col">What we compared</th><th scope="col" class="n">Match (R²)</th><th scope="col" class="n">Typical error</th></tr></thead><tbody>
          <tr><td>Our estimate, at all 23 stations</td><td class="n">0.87</td><td class="n">3.7 µg/m³</td></tr>
          <tr><td>… where the nearest other station is at most 2.5 km away (15 stations)</td><td class="n">0.90</td><td class="n">3.4 µg/m³</td></tr>
          <tr><td>… where it is farther than 2.5 km (8 stations)</td><td class="n">0.80</td><td class="n">5.9 µg/m³</td></tr>
          <tr><td>For comparison: a low-cost sensor next to an official station (typical value)</td><td class="n">0.68</td><td class="n">8.8 µg/m³</td></tr>
        </tbody></table></div>`,
        "<p class=\"small\">R² shows how well the estimate follows the real values from hour to hour (1 = perfect). The typical error is the root-mean-square error (RMSE).</p>",
        "<p>At the smog limit, the estimate caught 82% of the hidden station's smog hours and gave a false alarm in 2.5% of the hours without smog.</p>",
        "<p>Near the limit, even official stations disagree: in the hours when one of two stations is above 25 µg/m³, both are above it only about 55–60% of the time. That's why we write “smog likely”, not “smog for sure”.</p>",
      ]],
      ["Tonight's forecast", [
        "<p>We start from the value measured near you and follow the shape of the SILAM forecast. The gap between measurement and forecast fades out over about 6 hours.</p>",
        "<p>We correct the forecast by its typical gap to the stations over the last week (the median gap, at most ±10 µg/m³). We also keep how your area compares with the rest of the city over the last day, for example near a busy boulevard (between 0.6 and 1.6 times).</p>",
        "{live:bias}",
        "<p>In a month-long test, the unmodified SILAM model got the level nearly right (on average 0.97 of the stations' value), caught 62% of smog hours and gave a false alarm in 3% of the hours without smog. We used the first hours of each forecast; 12 hours or more ahead, the forecast is less certain. Our correction hasn't been tested over a long period yet: we are checking it this winter.</p>",
      ]],
      ["The limits", [
        "<p>Adia uses three levels for PM2.5: <b>good</b> up to 15 µg/m³, <b>moderate</b> from 15 to 25 and <b>smog</b> above 25. We apply them to every hour.</p>",
        "<p>For reference: the World Health Organization recommends at most 15 µg/m³ as a 24-hour average, and the EU daily limit from 2030 is 25 µg/m³. Both are daily averages, not hourly values.</p>",
        "<p>For Buzău, where we only have PM10, we use 20 and 30 µg/m³: at the Bucharest stations, PM2.5 is on average about 0.78 of PM10, so the limits are roughly equivalent.</p>",
        "<p>The European air quality index (6 levels, from “Good” to “Extremely poor”) is shown separately, for comparison.</p>",
      ]],
      ["The bedroom CO₂ calculator", [
        "<p>It is a calculation, not a measurement: 13 litres of CO₂ per hour for each person asleep, a 2.6 m ceiling, 0.4 air changes per hour with the window shut, outdoor air at 420 ppm, 600 ppm at bedtime and 8 hours of sleep. With the door open, we add 50 m³ of air from the rest of the home. Renovated rooms with airtight windows usually change their air less often, so the value is higher.</p>",
        "<p>Adia measures the real value in your room.</p>",
      ]],
      ["What it can't do", [
        "<ul><li>The values are for the outdoor air. With the window shut, fewer particles get into the room, but CO₂ builds up.</li><li>Stations are sparse at the edges of the city, so the error is larger there (see the table).</li><li>The data is provisional and can have gaps. If the latest measurement is more than 4 hours old we warn you; after 8 hours we give no advice.</li><li>This is not medical advice. If you have asthma or another respiratory condition, follow your doctor's advice.</li></ul>",
      ]],
      ["The stations in use now", ["{live:stations}"]],
    ],
    fresh: "The data is updated once an hour. Last update: {g} (Romanian time), with measurements up to {m}.",
    dropped: "Over the last week we dropped {z} zero or negative values, {s} stuck values and {p} isolated peaks.",
    bias: "The correction right now: {list}.",
    biasItem: "{city} {v} µg/m³ {p}",
    stHead: ["Station", "Type", "Measures"],
    type: { traffic: "near traffic", background: "urban background", industrial: "industrial area", other: "" },
    city: { bucharest: "Bucharest", buzau: "Buzău" },
    noData: "The current data couldn't be loaded, so the updated figures above are missing.",
  },
};

let D = null, failed = false, lang = "ro";
const $ = id => document.getElementById(id);
const esc = AC.esc;
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => (o[k] ?? ""));
const nf = (v, d = 0) => Number(v).toLocaleString(lang === "ro" ? "ro-RO" : "en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
const when = iso => new Intl.DateTimeFormat(lang === "ro" ? "ro-RO" : "en-GB", { timeZone: "Europe/Bucharest", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date(iso));

function live(key) {
  const L = T[lang];
  if (!D) return failed && key === "fresh" ? `<p class="live">${esc(L.noData)}</p>` : "";
  if (key === "fresh") return `<p class="live">${esc(fill(L.fresh, { g: when(D.generated), m: when(Date.parse(D.latest) + 3600e3) }))}</p>`;
  if (key === "dropped") {
    const d = D.dropped || {};
    return `<p class="live">${esc(fill(L.dropped, { z: d.zero_or_negative ?? 0, s: d.stuck ?? 0, p: d.spike ?? 0 }))}</p>`;
  }
  if (key === "bias") {
    const items = D.areas.map(a => {
      const v = (a.bias || {})[a.pollutant] ?? 0;
      return fill(L.biasItem, { city: L.city[a.name] || a.label, v: (v > 0 ? "+" : v < 0 ? "−" : "") + nf(Math.abs(v), 1), p: a.pollutant === "pm25" ? "PM2.5" : "PM10" });
    });
    return `<p class="live">${esc(fill(L.bias, { list: items.join("; ") }))}</p>`;
  }
  if (key === "stations") {
    const num = s => Number((/\d+/.exec(s.name) || [999])[0]);
    const list = [...D.stations].sort((a, b) => (a.area === b.area ? num(a) - num(b) : a.area === "bucharest" ? -1 : 1));
    const rows = list.map(s => {
      const meas = [s.pm25 ? "PM2.5" : "", s.pm10 ? "PM10" : ""].filter(Boolean).join(" · ");
      return `<tr><td>${esc(s.name)}<br><span class="small">${esc(s.place || L.city[s.area] || "")}</span></td><td>${esc(L.type[s.type] || "")}</td><td>${esc(meas)}</td></tr>`;
    }).join("");
    return `<div class="tbl"><table><thead><tr>${L.stHead.map(h => `<th scope="col">${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  return "";
}

function render() {
  const L = T[lang];
  $("content").innerHTML =
    `<div><a class="back" href="aer.html">${esc(L.back)}</a><h1>${esc(L.title)}</h1><p class="lead">${esc(L.lead)}</p></div>` +
    L.s.map(([h, parts], i) => `<section aria-labelledby="s${i}"><h2 id="s${i}">${esc(h)}</h2>${parts.map(p => (p.startsWith("{live:") ? live(p.slice(6, -1)) : p)).join("")}</section>`).join("");
  document.querySelectorAll(".stack table").forEach(t => {   // column names for the stacked phone layout
    const hs = [...t.querySelectorAll("thead th")].map(th => th.textContent);
    t.querySelectorAll("tbody tr").forEach(tr => [...tr.children].forEach((td, i) => td.setAttribute("data-label", hs[i] || "")));
  });
  AC.carry();
}

function setLang(l, save) {
  lang = l;
  document.documentElement.lang = l;
  document.title = T[l].pageTitle;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  $("site-line").innerHTML = AC.siteLine(l);
  render();
  AC.carry();
  if (save) {
    AC.store.set("adia-lang", l);
    try { if (location.hash === "#en" || location.hash === "#ro") history.replaceState(null, "", "#" + l); } catch (e) {}
  }
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang, true)));

let start = AC.store.get("adia-lang") || "ro";
if (location.hash === "#en" || location.hash === "#ro") start = location.hash.slice(1);
setLang(T[start] ? start : "ro", false);
fetch("data/air.json", { cache: "no-cache" })
  .then(r => (r.ok ? r.json() : Promise.reject(r.status)))
  .then(d => { if (!d || !Array.isArray(d.stations) || !Array.isArray(d.areas)) throw new Error("bad data"); D = d; })
  .catch(() => { failed = true; })
  .finally(render);
</script>
